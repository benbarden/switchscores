# Switch Scores redirects for Nginx - mirrors public/.htaccess, which Nginx ignores.
# Included inside the server block of /etc/nginx/sites-available/switchscores.com:
#   include /etc/nginx/snippets/switchscores-redirects.conf;
# Keep in step with public/.htaccess until codacity4 (Apache) is gone.
# Added 2026-10-16 (migration to infrared-switch).

# Redirect non-www to www
if ($host = switchscores.com) {
    return 301 https://www.switchscores.com$request_uri;
}

# Redirect index.html
location ~* ^/index\.html$ {
    return 301 https://www.switchscores.com/;
}

# Redirect trailing slashes if not a folder
if (!-d $request_filename) {
    rewrite ^/(.+)/$ https://www.switchscores.com/$1 permanent;
}

