# Switch Scores browser cache lifetimes for static files.
# Included inside the server block of /etc/nginx/sites-available/switchscores.com,
# after the dotfile deny block (regex locations match in order, so it must come after it):
#   include /etc/nginx/snippets/switchscores-static-cache.conf;
# Prod includes a copy in /etc/nginx/snippets/, so a change here needs copying there
# and an nginx reload; deploy.sh doesn't do it.
#
# Files linked with a ?v= version are cached for a year, as a new version gets a new URL.
# Files without one are cached for 7 days. Cloudflare keeps them that long too, so when
# replacing one of those, add a ?v= to its link or purge it in Cloudflare.
#
# XML, TXT and HTML files (sitemaps, robots.txt, the Google verification file) are left
# out on purpose, so they keep their current headers.

location ~* \.(css|js|map|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf|otf|eot)$ {
    # Only "set" inside "if": the one use of if in a location that Nginx treats as safe.
    # A map would be tidier, but map can't go in a snippet included inside server.
    set $static_cache "public, max-age=604800";
    if ($arg_v) {
        set $static_cache "public, max-age=31536000, immutable";
    }
    # No "always": a 404 for a missing file mustn't be cached for a week.
    add_header Cache-Control $static_cache;
    try_files $uri =404;
}
